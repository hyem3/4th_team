<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>ReseaMate - Research Map</title>
<style>
  :root {
    --ink: #101c44;          /* 제목·진한 글씨 */
    --text: #2b3558;         /* 본문 */
    --muted: #7380a3;        /* 보조 글씨 */
    --indigo: #4a58e0;       /* 포인트 색 */
    --indigo-deep: #3342c4;
    --sky: #e8eeff;         /* 연한 파랑 면 */
    --mist: #f4f7ff;         /* 전체 배경 */
    --line: #e0e7f7;        /* 테두리 */
    --white: #fff;
    --shadow: 0 1px 2px rgba(34,52,120,.06), 0 8px 24px -8px rgba(34,52,120,.16);
    --shadow-sm: 0 1px 2px rgba(34,52,120,.08), 0 3px 10px -3px rgba(34,52,120,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--mist); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 3px solid rgba(74,88,224,.45); outline-offset: 2px; }

  /* ---------- 왼쪽 사이드바 ---------- */
  nav.rail {
    width: 84px; flex: none; background: var(--white);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 0; gap: 6px;
  }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 13px; margin-bottom: 18px;
    background: linear-gradient(135deg, #6a7bff 0%, #3342c4 100%);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 6px 14px -4px rgba(51,66,196,.55);
  }
  .nav-item {
    width: 64px; padding: 9px 0 8px; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: none; border: 0; cursor: default;
  }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active { background: var(--sky); color: var(--indigo); }
  .nav-item[aria-disabled="true"] { opacity: .6; }
  .nav-spacer { flex: 1; }

  /* ---------- 오른쪽 전체(상단바 + 본문) ---------- */
  .shell { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; background: transparent;
  }
  .logo { font-weight: 800; font-size: 19px; letter-spacing: -.02em; color: var(--ink); margin-right: 6px; }
  #searchForm {
    display: flex; flex: 1; max-width: 520px; align-items: center;
    background: var(--white); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 4px 4px 16px; box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  #searchForm:focus-within { border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(74,88,224,.14); }
  #searchForm svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
  #searchInput {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none;
    padding: 9px 10px; font: inherit; font-size: 14px; color: var(--ink);
  }
  #searchInput::placeholder { color: #98a3c0; }

  button {
    font: inherit; font-size: 13.5px; font-weight: 600;
    border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer;
    background: var(--indigo); color: #fff;
    transition: background .15s, transform .1s, box-shadow .15s;
  }
  button:hover:not(:disabled) { background: var(--indigo-deep); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.ghost { background: var(--white); color: var(--indigo); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
  button.ghost:hover:not(:disabled) { background: var(--sky); }
  button:disabled { opacity: .5; cursor: default; }
  #backBtn { margin-left: auto; }

  /* ---------- 본문 ---------- */
  main { flex: 1; display: flex; min-height: 0; gap: 16px; padding: 0 16px 16px 0; }
  #mapWrap {
    flex: 1; position: relative; min-width: 0; overflow: hidden;
    border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow);
    background:
      radial-gradient(circle at 1px 1px, #c9d5f2 1.2px, transparent 1.6px) 0 0 / 24px 24px,
      radial-gradient(120% 90% at 0% 0%, #ffffff 0%, #eef3ff 55%, #e6edff 100%);
  }
  #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.dragging { cursor: grabbing; }

  .zoom {
    position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px;
    padding: 5px; background: rgba(255,255,255,.9); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-sm);
  }
  .zoom button { width: 34px; height: 34px; padding: 0; font-size: 18px; line-height: 1; background: none; color: var(--ink); }
  .zoom button:hover:not(:disabled) { background: var(--sky); }
  .zoom button.wide { width: auto; padding: 0 14px; font-size: 13px; color: var(--indigo); }
  .hint {
    position: absolute; right: 16px; bottom: 16px; font-size: 12px; color: var(--muted);
    background: rgba(255,255,255,.85); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 999px;
  }

  /* ---------- 지도 안의 그림 ---------- */
  .edge { fill: none; stroke: #b4c3ee; stroke-width: 2.5; stroke-linecap: round; }
  .node { cursor: pointer; filter: drop-shadow(0 4px 8px rgba(40,60,140,.14)); transition: filter .15s; }
  .node:hover { filter: drop-shadow(0 6px 12px rgba(40,60,140,.26)); }
  .node rect { fill: #fff; stroke: var(--line); stroke-width: 1.5; }
  .node.root rect { fill: url(#rootGrad); stroke: none; }
  .node.selected rect { stroke: var(--indigo); stroke-width: 3; }
  .node.root.selected rect { stroke: #fff; stroke-width: 3; }
  .node text { font-size: 15px; font-weight: 600; fill: var(--ink); pointer-events: none; }
  .node.root text { fill: #fff; font-weight: 700; }
  .node .badge { fill: var(--indigo); stroke: #fff; stroke-width: 2.5; }
  .node .badge-text { fill: #fff; font-size: 15px; font-weight: 700; }

  /* ---------- 오른쪽 패널 ---------- */
  aside { width: 336px; flex: none; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 2px; }
  .card {
    background: var(--white); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px; box-shadow: var(--shadow);
  }
  .card h3 { margin: 0 0 12px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .sel-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .actions button { padding: 8px 14px; font-size: 13px; }
  .paper {
    background: var(--mist); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-top: 10px; font-size: 13px; line-height: 1.45;
  }
  .paper b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 13.5px; font-weight: 700; }
  .paper span { color: var(--muted); font-size: 12.5px; }
  .empty { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 12px 0 0; }
  ol.history, ul.saved { margin: 0; padding: 0; list-style: none; }
  ol.history { display: flex; flex-wrap: wrap; gap: 6px; }
  ol.history li {
    padding: 5px 11px; border-radius: 999px; background: var(--sky); color: var(--indigo-deep);
    font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  ol.history li:hover { background: #d9e3ff; }
  ol.history li.now { background: var(--indigo); color: #fff; }
  ul.saved li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; margin-bottom: 8px; border-radius: 12px;
    background: var(--mist); border: 1px solid var(--line);
    color: var(--ink); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  ul.saved li:hover { border-color: var(--indigo); background: var(--sky); }
  ul.saved li.empty { background: none; border: 0; padding: 0; margin: 0; color: var(--muted); font-weight: 400; cursor: default; }
  ul.saved li .x { color: var(--muted); padding-left: 10px; }
  ul.saved li .x:hover { color: var(--ink); }

  @media (max-width: 860px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    nav.rail {
      width: 100%; flex-direction: row; justify-content: space-around; padding: 8px;
      border-right: 0; border-bottom: 1px solid var(--line); order: 2; gap: 0;
    }
    .brand-mark, .nav-spacer { display: none; }
    .shell { order: 1; }
    header { flex-wrap: wrap; padding: 12px 14px; }
    #searchForm { order: 3; flex-basis: 100%; max-width: none; }
    main { flex-direction: column; padding: 0 12px 12px; }
    #mapWrap { height: 58vh; flex: none; }
    aside { width: 100%; overflow: visible; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<nav class="rail" aria-label="주요 메뉴">
  <div class="brand-mark" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg>
  </div>
  <button class="nav-item" aria-disabled="true" title="준비 중이에요">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home
  </button>
  <button class="nav-item active" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explore
  </button>
  <button class="nav-item" aria-disabled="true" title="준비 중이에요">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8.5l3 7M16 8.5l-3 7M8.5 7h7"/></svg>Connect
  </button>
  <span class="nav-spacer"></span>

  </button>
</nav>

<div class="shell">
<header>
  <span class="logo">ReseaMate</span>
  <form id="searchForm">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" placeholder="연구 키워드를 입력해보세요 (예: AI, 머신러닝)" aria-label="연구 키워드">
    <button type="submit">검색</button>
  </form>
  <button id="backBtn" class="ghost">← 이전 지점으로</button>
</header>

<main>
  <section id="mapWrap">
    <svg id="map">
      <defs>
        <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6a7bff"/><stop offset="1" stop-color="#3342c4"/>
        </linearGradient>
      </defs>
      <g id="viewport">
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="zoom">
      <button id="zoomIn" title="확대" aria-label="확대">+</button>
      <button id="zoomOut" title="축소" aria-label="축소">−</button>
      <button id="fitBtn" class="wide">전체 보기</button>
    </div>
    <div class="hint">키워드 클릭 = 펼치기/접기 · 드래그 = 이동 · 스크롤 = 확대/축소</div>
  </section>

  <aside>
    <section class="card">
      <h3>선택한 키워드</h3>
      <div id="detail"></div>
    </section>
    <section class="card">
      <h3>탐색 경로 (클릭하면 그 지점으로 돌아가요)</h3>
      <ol id="history" class="history"></ol>
    </section>
    <section class="card">
      <h3>저장된 주제</h3>
      <ul id="saved" class="saved"></ul>
    </section>
  </aside>
</main>
</div>

<script>
/* =========================================================
   1. 데이터 (지금은 샘플. 2주차에 OpenAlex API로 바꿀 부분)
   - children: 이 키워드를 클릭하면 펼쳐질 하위 키워드
   - papers  : 이 키워드에 붙는 논문 카드
   ========================================================= */
const DATA = {
  "AI": {
    children: ["머신러닝", "자연어 처리"],
    papers: []
  },
  "머신러닝": {
    children: ["딥러닝", "강화학습"],
    papers: [
      { title: "Multimodal Machine Learning: A Survey and Taxonomy",
        authors: "Baltrušaitis et al.", venue: "TPAMI 2019" }
    ]
  },
  "딥러닝": {
    children: [],
    papers: [
      { title: "Deep learning", authors: "LeCun, Bengio, Hinton", venue: "Nature 2015" }
    ]
  },
  "강화학습": {
    children: [],
    papers: [
      { title: "Human-level control through deep reinforcement learning",
        authors: "Mnih et al.", venue: "Nature 2015" }
    ]
  },
  "자연어 처리": {
    children: ["텍스트 분석", "감성분석"],
    papers: [
      { title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding",
        authors: "Devlin et al.", venue: "NAACL 2019" }
    ]
  },
  "텍스트 분석": {
    children: [],
    papers: [
      { title: "Attention Is All You Need", authors: "Vaswani et al.", venue: "NeurIPS 2017" }
    ]
  },
  "감성분석": {
    children: [],
    papers: [
      { title: "Thumbs up? Sentiment Classification using Machine Learning Techniques",
        authors: "Pang, Lee, Vaithyanathan", venue: "EMNLP 2002" }
    ]
  }
};

function childrenOf(label) { return (DATA[label] && DATA[label].children) || []; }
function papersOf(label)   { return (DATA[label] && DATA[label].papers)   || []; }

/* =========================================================
   2. 상태 (화면이 기억해야 하는 것들)
   ========================================================= */
const STORE_KEY = "reseamate-research-map-v1";

function defaultState() {
  return {
    root: "AI",              // 지도의 출발점
    expanded: ["AI"],        // 펼쳐진 키워드 목록
    selected: "AI",          // 지금 선택한 키워드
    history: ["AI"],         // 탐색 경로 (방문 순서)
    saved: []                // 저장된 주제
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : defaultState();
  } catch (e) { return defaultState(); }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();
let view = { x: 0, y: 0, k: 1 };   // 지도의 이동(x,y)과 확대(k)
let current = [];                  // 지금 화면에 그려진 노드들

/* =========================================================
   3. 위치 계산 (왼쪽 → 오른쪽으로 펼쳐지는 나무 모양)
   ========================================================= */
const GAP_X = 240, GAP_Y = 64, NODE_H = 40;

function layout() {
  const nodes = [], edges = [];
  const seen = new Set();
  let leafCount = 0;

  function walk(label, depth) {
    seen.add(label);
    const node = {
      label, depth,
      x: depth * GAP_X,
      w: Math.max(70, label.length * 15 + 36),
      y: 0
    };
    nodes.push(node);

    const kids = state.expanded.includes(label)
      ? childrenOf(label).filter(c => !seen.has(c))
      : [];

    if (kids.length === 0) {
      node.y = leafCount * GAP_Y;
      leafCount++;
    } else {
      const kidNodes = kids.map(k => walk(k, depth + 1));
      kidNodes.forEach(kn => edges.push({ from: node, to: kn }));
      const ys = kidNodes.map(kn => kn.y);
      node.y = (Math.min(...ys) + Math.max(...ys)) / 2;   // 부모는 자식들의 가운데
    }
    return node;
  }

  walk(state.root, 0);
  return { nodes, edges };
}

/* =========================================================
   4. 그리기
   ========================================================= */
const svg = document.getElementById("map");
const viewport = document.getElementById("viewport");
const edgesG = document.getElementById("edges");
const nodesG = document.getElementById("nodes");

function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  kids.forEach(k => e.append(k));
  return e;
}

function renderMap() {
  const { nodes, edges } = layout();
  current = nodes;
  edgesG.innerHTML = "";
  nodesG.innerHTML = "";

  edges.forEach(e => {
    const x1 = e.from.x + e.from.w + 10, y1 = e.from.y;
    const x2 = e.to.x, y2 = e.to.y;
    const mx = (x1 + x2) / 2;
    edgesG.appendChild(svgEl("path", {
      class: "edge",
      d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`
    }));
  });

  nodes.forEach(n => {
    const cls = "node" + (n.depth === 0 ? " root" : "") + (n.label === state.selected ? " selected" : "");
    const g = svgEl("g", { class: cls, transform: `translate(${n.x},${n.y - NODE_H / 2})` });

    g.appendChild(svgEl("rect", { width: n.w, height: NODE_H, rx: 20 }));
    const t = svgEl("text", {
      x: n.w / 2, y: NODE_H / 2, "text-anchor": "middle", "dominant-baseline": "central"
    });
    t.textContent = n.label;
    g.appendChild(t);

    // 하위 키워드가 있으면 + / − 버튼 모양 표시
    if (childrenOf(n.label).length > 0) {
      const open = state.expanded.includes(n.label);
      g.appendChild(svgEl("circle", { class: "badge", cx: n.w + 2, cy: NODE_H / 2, r: 10 }));
      const bt = svgEl("text", {
        class: "badge-text", x: n.w + 2, y: NODE_H / 2,
        "text-anchor": "middle", "dominant-baseline": "central"
      });
      bt.textContent = open ? "−" : "+";
      g.appendChild(bt);
    }

    g.addEventListener("click", () => { if (!moved) onNodeClick(n.label); });
    nodesG.appendChild(g);
  });

  applyView();
}

function renderPanel() {
  // --- 선택한 키워드 + 논문 카드 ---
  const detail = document.getElementById("detail");
  detail.innerHTML = "";
  const sel = state.selected;
  const title = el("div", { textContent: sel, className: "sel-title" });
  detail.append(title);

  const isSaved = state.saved.includes(sel);
  detail.append(el("div", { className: "actions" },
    el("button", {
      textContent: isSaved ? "✓ 저장됨" : "🔖 이 주제 저장",
      disabled: isSaved,
      onclick: () => { state.saved.push(sel); update(); }
    }),
    el("button", {
      className: "ghost", textContent: "여기서 새로 시작",
      onclick: () => startFrom(sel)
    })
  ));

  const papers = papersOf(sel);
  if (papers.length === 0) {
    detail.append(el("p", {
      className: "empty",
      textContent: DATA[sel]
        ? "이 키워드에 연결된 논문 샘플이 없어요."
        : "샘플 데이터에 없는 키워드예요. 2주차에 OpenAlex API를 연결하면 실제 논문과 하위 키워드가 나옵니다."
    }));
  }
  papers.forEach(p => {
    detail.append(el("div", { className: "paper" },
      el("b", { textContent: p.title }),
      el("span", { textContent: p.authors + " · " + p.venue })
    ));
  });

  // --- 탐색 경로 ---
  const hist = document.getElementById("history");
  hist.innerHTML = "";
  state.history.forEach((label, i) => {
    const isNow = i === state.history.length - 1;
    hist.append(el("li", {
      className: isNow ? "now" : "",
      textContent: (i + 1) + ". " + label,
      onclick: () => goBackTo(i)
    }));
  });
  document.getElementById("backBtn").disabled = state.history.length < 2;

  // --- 저장된 주제 ---
  const savedUl = document.getElementById("saved");
  savedUl.innerHTML = "";
  if (state.saved.length === 0) {
    savedUl.append(el("li", { textContent: "아직 저장한 주제가 없어요", className: "empty" }));
  }
  state.saved.forEach(label => {
    const x = el("span", {
      className: "x", textContent: "✕", title: "삭제",
      onclick: (ev) => {
        ev.stopPropagation();
        state.saved = state.saved.filter(s => s !== label);
        update();
      }
    });
    savedUl.append(el("li", { onclick: () => startFrom(label) },
      el("span", { textContent: "🔖 " + label }), x));
  });
}

function update() {       // 상태가 바뀌면 → 저장하고 → 다시 그리기
  saveState();
  renderMap();
  renderPanel();
}

/* =========================================================
   5. 사용자 행동 (클릭, 검색, 뒤로가기)
   ========================================================= */
function onNodeClick(label) {
  state.selected = label;

  // 하위 키워드가 있으면 펼치기/접기
  if (childrenOf(label).length > 0) {
    if (state.expanded.includes(label)) {
      state.expanded = state.expanded.filter(l => l !== label);
    } else {
      state.expanded.push(label);
    }
  }
  // 탐색 경로에 기록 (같은 곳 연속 클릭은 중복 기록 안 함)
  if (state.history[state.history.length - 1] !== label) {
    state.history.push(label);
  }
  update();
}

function goBackTo(index) {            // 탐색 경로의 i번째 지점으로 돌아가기
  state.history = state.history.slice(0, index + 1);
  state.selected = state.history[index];
  update();
}

function startFrom(label) {           // label을 출발점으로 지도를 새로 시작
  state = { ...state, root: label, expanded: [label], selected: label, history: [label] };
  update();
  fitView();
}

document.getElementById("backBtn").onclick = () => {
  if (state.history.length > 1) goBackTo(state.history.length - 2);
};

document.getElementById("searchForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const input = document.getElementById("searchInput");
  const text = input.value.trim();
  if (!text) return;
  // 대소문자 무시하고 샘플 데이터에서 찾기. 없으면 입력한 글자 그대로 시작
  const found = Object.keys(DATA).find(k => k.toLowerCase() === text.toLowerCase());
  startFrom(found || text);
  input.value = "";
});

/* =========================================================
   6. 지도 이동 / 확대 (드래그, 스크롤, 버튼)
   ========================================================= */
function applyView() {
  viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}

function fitView() {                   // 지도 전체가 한눈에 보이게 맞추기
  if (!current.length) return;
  const r = svg.getBoundingClientRect();
  const minX = Math.min(...current.map(n => n.x));
  const maxX = Math.max(...current.map(n => n.x + n.w + 14));
  const minY = Math.min(...current.map(n => n.y)) - NODE_H;
  const maxY = Math.max(...current.map(n => n.y)) + NODE_H;
  const k = Math.min(1.2, r.width / (maxX - minX + 80), r.height / (maxY - minY + 80));
  view.k = k;
  view.x = r.width / 2 - ((minX + maxX) / 2) * k;
  view.y = r.height / 2 - ((minY + maxY) / 2) * k;
  applyView();
}

function zoomAt(factor, cx, cy) {      // (cx, cy) 지점을 기준으로 확대/축소
  const newK = Math.min(2.5, Math.max(0.3, view.k * factor));
  const real = newK / view.k;
  view.x = cx - (cx - view.x) * real;
  view.y = cy - (cy - view.y) * real;
  view.k = newK;
  applyView();
}

let dragging = false, moved = false, startX = 0, startY = 0, startVX = 0, startVY = 0;

svg.addEventListener("pointerdown", (e) => {
  dragging = true; moved = false;
  startX = e.clientX; startY = e.clientY;
  startVX = view.x; startVY = view.y;
});
window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) {
    moved = true;
    svg.classList.add("dragging");
  }
  if (moved) {
    view.x = startVX + dx;
    view.y = startVY + dy;
    applyView();
  }
});
window.addEventListener("pointerup", () => {
  dragging = false;
  svg.classList.remove("dragging");
  setTimeout(() => { moved = false; }, 0);   // 드래그 직후 클릭이 노드에 먹히지 않게
});

svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

function zoomFromCenter(f) {
  const r = svg.getBoundingClientRect();
  zoomAt(f, r.width / 2, r.height / 2);
}
document.getElementById("zoomIn").onclick = () => zoomFromCenter(1.25);
document.getElementById("zoomOut").onclick = () => zoomFromCenter(0.8);
document.getElementById("fitBtn").onclick = fitView;
window.addEventListener("resize", fitView);

/* =========================================================
   7. 시작!
   ========================================================= */
renderMap();
renderPanel();
fitView();
</script>
</body>
</html>
