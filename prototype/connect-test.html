
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ReseaMate Step 2 기능 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      line-height: 1.6;
    }
    .pass { color: green; }
    .fail { color: red; }
    .paper {
      border: 1px solid #ddd;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
    }
    section { margin-bottom: 28px; }
  </style>
</head>
<body>

  <h1>ReseaMate Step 2 기능 테스트</h1>
  <p>4개 연구 주제의 논문 연결 기능을 검사합니다.</p>

  <div id="results"></div>

  <script src="./connect-logic.js"></script>

  <script>
    const container = document.getElementById("results");
    const API = window.ReseaMateConnect;

    const topics = [
      { name: "Covid-19", count: 2, score: 42 },
      { name: "Algorithmic System", count: 2, score: 85 },
      { name: "Beyond Existing Topics", count: 1, score: null },
      { name: "Recent Social Issue", count: 1, score: null }
    ];

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    if (!API) {
      addText(container, "h2",
        "FAIL: connect-logic.js를 불러오지 못했습니다.",
        "fail");
    } else {
      let passed = 0;

      topics.forEach(topic => {
        const section = document.createElement("section");
        container.appendChild(section);

        addText(section, "h2", topic.name);

        const result = API.getConnection(
          "Adaptive Understanding",
          topic.name
        );

        if (!result) {
          addText(section, "p", "FAIL: 연결 정보 없음", "fail");
          return;
        }

        const countOK = result.papers.length === topic.count;
        const scoreOK = result.score === topic.score;
        const fieldsOK = result.papers.every(p =>
          p.title && p.authors && p.year && p.url
        );

        if (countOK && scoreOK && fieldsOK) {
          passed++;
          addText(section, "p", "PASS: 연결 데이터 정상", "pass");
        } else {
          addText(section, "p", "FAIL: 데이터 확인 필요", "fail");
        }

        addText(section, "p",
          "연결 점수: " +
          (result.score === null ? "미정" : result.score + "%")
        );

        addText(section, "p",
          "연결 설명: " + result.description
        );

        result.papers.forEach(paper => {
          const card = document.createElement("div");
          card.className = "paper";
          section.appendChild(card);

          addText(card, "strong", paper.title);
          addText(card, "p",
            paper.authors + " (" + paper.year + ")"
          );

          const link = document.createElement("a");
          link.href = paper.url;
          link.textContent = "논문 원문/출처 확인";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          card.appendChild(link);
        });
      });

      addText(
        container,
        "h2",
        "테스트 결과: " + passed + " / 4개 주제 통과",
        passed === 4 ? "pass" : "fail"
      );
    }
  </script>
</body>
</html>
