
name: Build Research Map Preview

on:
  push:
    branches: 'jh_리서치맵-캔버스'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Research Map files..."
          test -f index.html
          test -f js/app.js
          test -f css/style.css
          test -f data/mock.json
          echo "All required files found."

      - name: Package website
        run: |
          zip -r research-map-preview.zip \
            index.html css js data

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: research-map-preview
          path: research-map-preview.zip
          retention-days: 7
